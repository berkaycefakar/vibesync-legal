<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuaye daveti</title>
<meta property="og:title" content="Fuaye'de bir davetin var">
<meta property="og:description" content="Aynı etkinliğe gidenlerle tanış, birlikte git.">
<style>
  :root { --bg: #0a0514; --card: #f3ede4; --ink: #1a1024; --muted: #6b6077; --pink: #ff4fd8; --fg2: rgba(255,255,255,.7); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(120% 80% at 50% 0%, #2a0f3d 0%, var(--bg) 60%); color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  main { width: 100%; max-width: 380px; display: grid; gap: 20px; text-align: center; }
  .brand { font-weight: 800; letter-spacing: -.5px; font-size: 22px; }
  .lede { margin: 0; color: var(--fg2); line-height: 1.5; }
  .ticket { background: var(--card); color: var(--ink); border-radius: 20px; padding: 22px 20px; text-align: left;
    border-top: 4px solid var(--pink); display: grid; gap: 6px; }
  .label { font: 600 11px ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: #b0279a; }
  h1 { margin: 0; font-size: 24px; line-height: 1.15; letter-spacing: -.4px; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 15px; }
  .btn { display: block; padding: 15px 18px; border-radius: 14px; background: var(--pink); color: #14061c;
    font-weight: 700; text-decoration: none; font-size: 16px; }
  .note { color: rgba(255,255,255,.5); font-size: 13px; line-height: 1.5; margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand">Fuaye</div>
  <p class="lede">Bir arkadaşın seni bu etkinliğe çağırıyor. Aynı etkinliğe gidenlerle tanış, birlikte git.</p>
  <div class="ticket">
    <span class="label">Davet</span>
    <h1 id="title">Bir etkinlik</h1>
    <span class="meta" id="when" hidden></span>
    <span class="meta" id="place" hidden></span>
  </div>
  <a class="btn" id="open" href="vibesync://">Fuaye'de aç</a>
  <p class="note">Uygulama açılmadıysa henüz yüklü değildir. Fuaye şu an kapalı beta aşamasında; davet eden arkadaşından TestFlight linkini isteyebilirsin.</p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const set = (id, v) => { if (v) { const el = document.getElementById(id); el.textContent = v.slice(0, 160); el.hidden = false; } };
  set('title', q.get('t')); set('when', q.get('w')); set('place', q.get('p'));
  if (q.get('t')) document.title = q.get('t').slice(0, 80) + ' · Fuaye';
  const id = q.get('id') || '';
  if (/^[0-9a-fA-F-]{36}$/.test(id)) {
    const deep = 'vibesync://event/' + id;
    // Only on tap: without the app, Safari answers an automatic redirect
    // with an "address is invalid" alert.
    document.getElementById('open').href = deep;
  }
</script>
</body>
</html>
